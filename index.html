<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>シラバス解析アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>シラバス解析アプリ</h1>
    <h2>モードを選んでください</h2>
    <div class="main-button">
      <div class="main-button1" onclick="location.href='single.html'">
        <div class="button-title">
          <h2>解析モード</h2>
          <img src="mushimegane.png" alt="虫眼鏡のアイコン" />
        </div>
        <h3>
          シラバスを入力すると、評価方法、難易度、向き不向き等を解析します
        </h3>
      </div>
      <div class="main-button1" onclick="location.href='double.html'">
        <div class="button-title">
          <h2>比較モード</h2>
          <img src="boad.png" alt="表のアイコン" />
        </div>
        <h3>複数のシラバスを解析して比較することができます</h3>
      </div>
    </div>
  </body>
</html>
